# The video maker on a home server, reached through Tailscale Funnel.
# Run it with ./video-maker, which sets everything up. See README.md.

services:
  app:
    image: ${IMAGE:-ghcr.io/jasontheodorou/video-maker:latest}
    container_name: video-maker
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
      HOST: 0.0.0.0
      VIDEO_INTERPRETER_BACKEND: api
      # Tailscale Funnel is HTTPS only, so the sign-in cookie is always marked Secure.
      COOKIE_SECURE: "1"
      TZ: ${TZ:-Europe/London}
    # Only this machine can reach the app directly. Tailscale Funnel carries it to the internet over HTTPS.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    # Time for the app to stop the video being made and mark it stopped, so Try again works after a restart.
    stop_grace_period: 30s
    # The app needs no special powers: it runs as the "node" user and listens on a high port.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Stop a runaway video from taking the whole machine. Raise it on a machine with more memory.
    mem_limit: ${MEM_LIMIT:-6g}
    pids_limit: 2048
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
